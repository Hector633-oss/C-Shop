<!-- Declaración del tipo de documento HTML5 -->
<!DOCTYPE html> <!-- Declara el tipo de documento como HTML5 -->
<!-- Apertura del documento con idioma español -->
<html lang="es"> <!-- Abre el documento HTML con idioma español para SEO y accesibilidad -->
<!-- Bloque de metadatos de la página del configurador de PC -->
<head> <!-- Abre la cabecera con metadatos de la página del configurador de PC -->
  <meta charset="UTF-8"> <!-- Define la codificación de caracteres UTF-8 para soporte multilingüe -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura el viewport para diseño responsivo en móviles -->
  <meta name="theme-color" content="#0a0a0b"> <!-- Define el color de la barra del navegador en móviles -->
  <title>Configurar PC · C-Shop</title> <!-- Título de la pestaña del navegador para la página del configurador de PC -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Preconecta con el servidor de Google Fonts para reducir latencia -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- Preconecta con el CDN de fuentes de Google con CORS habilitado -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <!-- Carga las fuentes tipográficas Syne y DM Sans usadas en toda la tienda -->
  <link rel="stylesheet" href="styles.css"> <!-- Enlaza la hoja de estilos principal de C-Shop -->
</head> <!-- Cierra la cabecera de metadatos -->
<!-- Cuerpo visible de la página del configurador de PC -->
<body> <!-- Abre el cuerpo de la página del configurador de PC pieza a pieza -->

<!-- Contenedor principal de la página del configurador -->
<main> <!-- Abre el contenido principal de la página del configurador de PC -->
<!-- Sección del configurador de PC con pasos y resumen lateral -->
  <section class="section visible"> <!-- Abre la sección principal visible del configurador de PC -->
<!-- Cabecera con título y botón de retorno -->
    <div class="pv-header"> <!-- Contenedor de la cabecera del configurador de PC -->
      <div class="pv-title"> <!-- Contenedor del título y navegación de retorno del configurador -->
        <a class="back-btn" href="index.html" data-i18n="nav.back">← Volver</a> <!-- Botón de retorno a la página de inicio -->
        <span data-i18n="config.title">🔧 Configurar PC</span> <!-- Título de la página del configurador de PC -->
      </div> <!-- Cierra el contenedor del título del configurador -->
    </div> <!-- Cierra la cabecera del configurador -->
<!-- Subtítulo descriptivo del configurador -->
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:24px;max-width:680px"
       data-i18n="config.subtitle">Selecciona los componentes para tu PC ideal. Verás compatibilidad y total en tiempo real.</p> <!-- Descripción del funcionamiento del configurador de PC -->
<!-- Cuadrícula principal del configurador: pasos a la izquierda, resumen a la derecha -->
    <div class="config-grid"> <!-- Contenedor de la cuadrícula de dos columnas del configurador -->
<!-- Panel de pasos del configurador: selección de cada componente -->
      <div class="config-steps" id="configSteps"></div> <!-- Contenedor de los pasos de selección de componentes, populado dinámicamente por configurador.js -->
<!-- Panel lateral de resumen de la configuración en curso -->
      <aside class="config-summary"> <!-- Panel lateral con el resumen y el total de la configuración de PC -->
        <div class="cs-sum-title" data-i18n="config.your_config">🛒 Tu configuración</div> <!-- Título del panel lateral de resumen de la configuración -->
<!-- Lista de componentes seleccionados en el configurador -->
        <div class="cs-sum-items" id="configSummaryItems"> <!-- Contenedor de los componentes ya seleccionados en el resumen lateral -->
          <div class="cs-sum-empty" data-i18n="config.empty">Ningún componente seleccionado</div> <!-- Mensaje vacío del resumen cuando no hay componentes seleccionados -->
        </div> <!-- Cierra el contenedor de componentes seleccionados -->
        <div class="cs-divider"></div> <!-- Separador visual entre la lista de componentes y el total en el panel lateral -->
<!-- Fila del precio total de la configuración -->
        <div class="cs-total-row"> <!-- Contenedor de la fila del precio total de la configuración -->
          <span data-i18n="config.total">Total</span> <!-- Etiqueta de la fila del precio total de la configuración -->
          <span class="cs-total-price" id="configTotal">0,00€</span> <!-- Precio total acumulado de los componentes seleccionados, actualizado en tiempo real -->
        </div> <!-- Cierra la fila del precio total -->
        <div class="config-compat" id="configCompat" data-i18n="config.compat">✅ Configuración compatible</div> <!-- Indicador de compatibilidad de la configuración, actualizado por configurador.js -->
<!-- Botón para añadir todos los componentes al carrito -->
        <button class="config-add-all" id="configAddAll" onclick="addConfigToCart()" disabled
                data-i18n="config.add_all">Añadir todo al carrito</button> <!-- Botón que añade todos los componentes de la configuración al carrito, deshabilitado sin selección -->
      </aside> <!-- Cierra el panel lateral de resumen de la configuración -->
    </div> <!-- Cierra la cuadrícula principal del configurador -->
  </section> <!-- Cierra la sección principal del configurador de PC -->
</main> <!-- Cierra el contenido principal de la página del configurador -->

<!-- Bloque de scripts de la página del configurador de PC -->
<script defer src="js/i18n.js?v=1"></script> <!-- Carga el sistema de internacionalización para textos multilingüe -->
<script defer src="js/data-lite.js?v=5"></script> <!-- Carga el módulo de acceso a datos de productos de la tienda -->
<script defer src="js/common.js?v=5"></script> <!-- Carga utilidades y funciones compartidas entre todas las páginas -->
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script> <!-- Carga el núcleo de Firebase para la conexión con la base de datos -->
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script> <!-- Carga el módulo de autenticación de Firebase para el login de usuarios -->
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script> <!-- Carga el módulo Firestore de Firebase para la base de datos de productos y pedidos -->
<script defer src="js/auth.js?v=5"></script> <!-- Carga la lógica de autenticación y sesión de usuario de C-Shop -->
<script defer src="js/layout.js?v=5"></script> <!-- Carga el módulo que construye la navegación, carrito y modal de login -->
<script defer src="js/products.js?v=5"></script> <!-- Carga el módulo de renderizado de tarjetas de producto -->
<script defer src="js/configurador.js?v=8"></script> <!-- Carga la lógica específica del configurador: pasos, selección de componentes, compatibilidad y total en tiempo real -->
</body> <!-- Cierra el cuerpo de la página del configurador de PC -->
</html> <!-- Cierra el documento HTML de la página del configurador de PC -->
